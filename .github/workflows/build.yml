name: Build Void Kernel (Neutron Clang)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Void Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libncurses5-dev libssl-dev libxml2-utils xsltproc bc rsync libelf-dev

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          cd clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          bash antman -S
          cd ..

      - name: Setup KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          sed -i 's/depends on KPROBES && EXT4_FS/depends on EXT4_FS/g' KernelSU-Next/kernel/Kconfig
          sed -i 's/#if defined(__x86_64__)/#if 1/g' KernelSU-Next/kernel/hook/syscall_hook.h
          sed -i 's/typedef sys_call_ptr_t syscall_fn_t;/typedef void *syscall_fn_t;/g' KernelSU-Next/kernel/hook/syscall_hook.h

      - name: Build Kernel Image
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export KBUILD_BUILD_USER=Saish
          export KBUILD_BUILD_HOST=VoidOS

          # Defconfig load (Xiaomi Miatoll)
          if [ -f arch/arm64/configs/vendor/xiaomi/miatoll_defconfig ]; then
            make O=out vendor/xiaomi/miatoll_defconfig
          elif [ -f arch/arm64/configs/stock_defconfig ]; then
            make O=out stock_defconfig
          elif [ -f arch/arm64/configs/vendor/atoll-perf_defconfig ]; then
            make O=out vendor/atoll-perf_defconfig
          else
            make O=out defconfig
          fi

          # Compile Kernel & DTBs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_BUILD_USER=Saish \
            KBUILD_BUILD_HOST=VoidOS

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AK3/
          fi
          cp anykernel.sh AK3/
          cd AK3
          zip -r9 ../Void-Kernel-Clean.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-Kernel-Clean-Build
          path: Void-Kernel-Clean.zip
