name: Build Void Kernel (Neutron Clang)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Void Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev libncurses5-dev libssl-dev \
            libxml2-utils xsltproc bc rsync libelf-dev

      # Cache Neutron Clang
      - name: Cache Neutron Clang
        uses: actions/cache@v4
        with:
          path: clang
          key: neutron-clang-${{ runner.os }}-24
          restore-keys: |
            neutron-clang-${{ runner.os }}-

      - name: Setup Neutron Clang
        run: |
          if [ ! -x clang/bin/clang ]; then
            mkdir -p clang
            cd clang
            curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
            bash antman -S
            cd ..
          else
            echo "Neutron Clang cache hit!"
          fi

      # Cache compiler output
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kernel-ccache-${{ runner.os }}-${{ hashFiles('Makefile', 'arch/arm64/Makefile', '**/Kconfig*') }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config

      - name: Setup VoidSU Driver
        run: |
          curl -LSs "https://raw.githubusercontent.com/heySaish/VoidSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export KBUILD_BUILD_USER=saish
          export KBUILD_BUILD_HOST=void

          # Defconfig load (Xiaomi Miatoll)
          if [ -f arch/arm64/configs/vendor/xiaomi/miatoll_defconfig ]; then
            make O=out vendor/xiaomi/miatoll_defconfig
          elif [ -f arch/arm64/configs/stock_defconfig ]; then
            make O=out stock_defconfig
          elif [ -f arch/arm64/configs/vendor/atoll-perf_defconfig ]; then
            make O=out vendor/atoll-perf_defconfig
          else
            make O=out defconfig
          fi

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="-VoidKernel" \
            KBUILD_BUILD_USER=saish \
            KBUILD_BUILD_HOST=void

      - name: ccache statistics
        run: |
          ccache --show-stats

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AK3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AK3/
          fi

          cp anykernel.sh AK3/

          cd AK3
          zip -r9 ../Void-Kernel-Clean.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void-Kernel-Clean-Build
          path: Void-Kernel-Clean.zip
